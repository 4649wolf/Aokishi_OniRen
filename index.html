<!doctype html>
<html lang="ja">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#080b12"><meta name="description" content="青騎士さんのための1曲専用カラオケチャレンジ。音程を合わせ、最後まで歌い切ろう。">
 <title>青騎士さん専用鬼レンチャン</title>
 <link rel="icon" href="./assets/microphone.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css">
</head>
<body>
 <main class="app">
  <header class="header">
   <h1>青騎士さん専用 鬼レンチャン</h1>
  </header>
  <div class="stage-top"><span id="phase" role="status">素材を読み込み中…</span><button id="fullscreen" class="text-button" type="button" aria-label="ステージを全画面表示">↗ 全画面</button></div>
  <section id="stage" class="stage" aria-label="カラオケステージ">
   <img class="backdrop" src="./assets/background.png" alt="">
   <video id="camera" class="source-video" autoplay muted playsinline aria-hidden="true"></video>
   <canvas id="camera-layer" class="camera-layer" width="1280" height="720" hidden aria-label="クロマキー処理したカメラ・VTuberの映像"></canvas>
   <video id="performance" class="source-video" preload="auto" playsinline disablepictureinpicture tabindex="-1" aria-hidden="true"><source src="./assets/performance.mp4" type="video/mp4"></video>
   <canvas id="composite" width="1920" height="1080" aria-label="背景を透過した課題曲の映像"></canvas>
   <canvas id="notes" width="1920" height="1080" aria-label="白い目標音程バー、黄色い正解部分、赤い音程外れ、青い現在地バーと歌い出しまでの吹き出し"></canvas>
   <div id="result" class="result" hidden aria-live="assertive">
    <p id="result-kicker" class="eyebrow"></p><h2 id="result-title"></h2><p id="result-detail"></p>
    <div class="result-actions"><button id="retry" class="primary" type="button">もう一度挑戦</button><button id="back" class="secondary" type="button">準備に戻る</button></div>
   </div>
  </section>
  <div class="live-strip"><div id="mic-state" hidden><span id="live-dot" class="dot"></span><span id="live-status"></span></div><span id="time">00:00 / 00:16</span></div>
  <div class="control-grid">
   <section class="panel listen-panel" aria-labelledby="listen-title">
    <div class="panel-heading"><span class="step">01</span><h2 id="listen-title">課題曲を聴く</h2><span id="listen-count" class="small-tag">何度でも</span></div>
    <audio id="practice" controls preload="metadata" src="./assets/practice.wav" aria-label="課題曲のお手本"></audio>
    <div class="listen-bottom"><label class="check"><input id="loop" type="checkbox"> 繰り返し聴く</label></div>
    <div class="note-key"><span>ノートの高さ</span><button id="key-down" class="secondary" type="button" aria-label="ノートを半音下げる" disabled>−</button><output id="key-value">-12</output><button id="key-up" class="secondary" type="button" aria-label="ノートを半音上げる" disabled>＋</button><button id="key-reset" class="text-button" type="button" disabled>原曲</button></div>
    <div class="pitch-test-actions"><button id="pitch-test" class="secondary" type="button" aria-pressed="false" disabled>音程テスト</button><button id="test-tone" class="secondary" type="button" disabled>基準音</button><span id="test-target">C3</span></div>
    <div id="pitch-probe" class="pitch-probe" hidden><output id="test-reading" aria-live="polite">—</output><label class="probe-level">入力 <meter id="test-level" min="0" max="0.2" value="0"></meter></label><label class="probe-gain">入力感度 <input id="mic-gain" type="range" min="1" max="4" step="0.25" value="1"><output id="gain-value">1×</output></label></div>
   </section>
   <section class="panel challenge-panel" aria-labelledby="challenge-title">
    <div class="panel-heading"><span class="step">02</span><h2 id="challenge-title">曲に挑戦する</h2></div>
    <div class="device-buttons"><button id="mic-button" class="secondary" type="button">マイクを接続</button><button id="camera-button" class="secondary" type="button">カメラを接続 <span>任意</span></button><button id="release" class="text-button" type="button" hidden>接続を解除</button></div>
    <details class="camera-settings"><summary>カメラ・クロマキー</summary><div class="camera-fields">
     <div class="camera-source"><label for="camera-device">カメラ</label><select id="camera-device"><option value="">標準のカメラ</option></select><button id="camera-refresh" class="text-button" type="button" aria-label="カメラ一覧を更新">更新</button></div>
     <div class="camera-key-row"><label for="camera-key">クロマキー</label><select id="camera-key"><option value="off">なし</option><option value="green">緑</option><option value="blue">青</option></select></div>
     <label class="camera-strength" for="camera-strength">透過の強さ <input id="camera-strength" type="range" min="0" max="100" step="1" value="50" disabled></label>
    </div></details>
    <div class="start-row"><button id="start" class="primary" type="button" disabled>挑戦をはじめる <span>→</span></button><button id="stop" class="secondary" type="button" hidden>中断する</button></div>
    <p id="device-message" class="device-message" role="status" hidden></p>
   </section>
  </div>
  <noscript>このアプリにはJavaScriptを有効にする必要があります。</noscript>
 </main>
 <script type="module" src="./src/app.js"></script>
</body>
</html>
