<!doctype html>
<html lang="ja">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#080b12"><meta name="description" content="青騎士さんのための1曲専用カラオケチャレンジ。音程を合わせ、最後まで歌い切ろう。">
 <title>青騎士さん専用鬼レンチャン</title>
 <link rel="icon" href="./assets/microphone.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css">
</head>
<body>
 <main class="app">
  <header class="header">
   <h1>青騎士さん専用 鬼レンチャン</h1>
  </header>
  <div class="stage-top"><span id="phase" role="status">素材を読み込み中…</span><button id="fullscreen" class="text-button" type="button" aria-label="ステージを全画面表示">↗ 全画面</button></div>
  <section id="stage" class="stage" aria-label="カラオケステージ">
   <img class="backdrop" src="./assets/background.png" alt="">
   <video id="camera" class="camera" autoplay muted playsinline aria-label="自分のカメラ映像"></video>
   <div id="camera-placeholder" class="camera-placeholder"><span class="camera-symbol">◎</span><p>あなたのステージ</p><small>カメラをつなぐと、ここに映ります</small></div>
   <video id="performance" class="source-video" preload="auto" playsinline disablepictureinpicture tabindex="-1" aria-hidden="true"><source src="./assets/performance.mp4" type="video/mp4"></video>
   <canvas id="composite" width="1920" height="1080" aria-label="背景を透過した課題曲の映像"></canvas>
   <canvas id="notes" width="1920" height="1080" aria-label="白い目標音程バー、黄色い正解部分、赤い音程外れ、青い現在地バーと歌い出しまでの吹き出し"></canvas>
   <div id="result" class="result" hidden aria-live="assertive">
    <p id="result-kicker" class="eyebrow"></p><h2 id="result-title"></h2><p id="result-detail"></p>
    <div class="result-actions"><button id="retry" class="primary" type="button">もう一度挑戦</button><button id="back" class="secondary" type="button">準備に戻る</button></div>
   </div>
  </section>
  <div class="live-strip"><div><span id="live-dot" class="dot"></span><span id="live-status">マイク接続前</span></div><span id="time">00:00 / 00:16</span></div>
  <div class="control-grid">
   <section class="panel listen-panel" aria-labelledby="listen-title">
    <div class="panel-heading"><span class="step">01</span><h2 id="listen-title">課題曲を聴く</h2><span id="listen-count" class="small-tag">何度でも</span></div>
    <audio id="practice" controls preload="metadata" src="./assets/practice.wav" aria-label="課題曲のお手本"></audio>
    <div class="listen-bottom"><label class="check"><input id="loop" type="checkbox"> 繰り返し聴く</label><span>お手本音源 / 約11秒</span></div>
   </section>
   <section class="panel challenge-panel" aria-labelledby="challenge-title">
    <div class="panel-heading"><span class="step">02</span><h2 id="challenge-title">曲に挑戦する</h2></div>
    <div class="device-buttons"><button id="mic-button" class="secondary" type="button">マイクを接続</button><button id="camera-button" class="secondary" type="button">カメラを接続 <span>任意</span></button><button id="release" class="text-button" type="button" hidden>接続を解除</button></div>
    <div class="start-row"><button id="start" class="primary" type="button" disabled>挑戦をはじめる <span>→</span></button><button id="stop" class="secondary" type="button" hidden>中断する</button></div>
    <p id="device-message" class="device-message" role="status">マイクを接続すると挑戦できます。</p>
   </section>
  </div>
  <footer><span>青騎士さん専用鬼レンチャン</span><span>カメラ・マイクは端末内で処理します。録音・外部送信はしません。</span></footer>
  <noscript>このアプリにはJavaScriptを有効にする必要があります。</noscript>
 </main>
 <script type="module" src="./src/app.js"></script>
</body>
</html>
